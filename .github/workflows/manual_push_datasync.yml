name: pre-registration-datasync-service build

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NAMESPACE: ${{ secrets.dev_namespace_docker_hub }}
      SERVICE_NAME: pre-registration-datasync-service
      SERVICE_LOCATION: pre-registration/pre-registration-datasync-service

    steps:
      - uses: actions/checkout@v4

      # ✅ Java 11 (Temurin)
      - name: Set up JDK 11 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Setup branch and env
        run: |
          echo "BRANCH_NAME=$(echo ${{ github.ref }} | sed -e 's,.*/\(.*\),\1,')" >> $GITHUB_ENV
          echo "GPG_TTY=$(tty)" >> $GITHUB_ENV

      - name: Install GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2

      # ✅ Maven cache
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      # ✅ Maven settings
      - name: Setup Maven settings
        run: |
          cat <<EOF > $GITHUB_WORKSPACE/settings.xml
          <settings>
            <servers>
              <server>
                <id>ossrh</id>
                <username>${{secrets.ossrh_user}}</username>
                <password>${{secrets.ossrh_secret}}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>ossrh</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <properties>
                  <gpg.executable>gpg2</gpg.executable>
                  <gpg.passphrase>${{secrets.gpg_secret}}</gpg.passphrase>
                </properties>
              </profile>
            </profiles>
          </settings>
          EOF

      # ✅ Build project
      - name: Build with Maven
        run: |
          cd ./pre-registration
          mvn clean install -U \
            -s $GITHUB_WORKSPACE/settings.xml \
            -DskipTests \
            -Dgpg.skip=true

      # 🔍 Debug: check jar
      - name: Verify built JAR
        run: |
          echo "Listing JAR files..."
          find pre-registration -name "*.jar"

      # ✅ Safe jar copy (FIXED)
      - name: Copy jar to Docker context
        run: |
          echo "Searching for jar..."
          JAR_FILE=$(find pre-registration -name "*.jar" | head -n 1)

          echo "Found jar: $JAR_FILE"

          if [ -z "$JAR_FILE" ]; then
            echo "❌ ERROR: No JAR file found!"
            exit 1
          fi

          cp "$JAR_FILE" pre-registration/pre-registration-datasync-service/app.jar

      # ✅ Build Docker image
      - name: Build Docker image
        run: |
          cd "${{env.SERVICE_LOCATION}}"
          docker build -t ${{ env.SERVICE_NAME }} .

      # ✅ Login Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.release_docker_hub }}" | docker login \
          -u ${{ secrets.actor_docker_hub }} --password-stdin

      # ✅ Push image
      - name: Push Docker image
        run: |
          IMAGE_ID=$NAMESPACE/$SERVICE_NAME
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=$BRANCH_NAME

          echo "IMAGE_ID=$IMAGE_ID"
          echo "VERSION=$VERSION"

          docker tag $SERVICE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
